
services:

  # ============================================================
  # LARAVEL APPLICATION IMAGE
  # ============================================================
  app:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - path: .env
        required: false

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      LOG_CHANNEL: stderr

    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "9000"

    networks:
      - meterlab-network

  # ============================================================
  # INITIALIZE PUBLIC FILES FOR NGINX
  # ============================================================
  public-init:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}
    restart: "no"

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /shared-public
        cp -a /var/www/html/public/. /shared-public/
        echo "Public assets synchronized."

    volumes:
      - public_assets:/shared-public

    depends_on:
      app:
        condition: service_started

    networks:
      - meterlab-network

  # ============================================================
  # NGINX
  # ============================================================

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    image: meterlab-nginx:${APP_IMAGE_TAG:-latest}

    restart: unless-stopped

    volumes:
      - public_assets:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage/app/public:ro

    depends_on:
      app:
        condition: service_started
      public-init:
        condition: service_completed_successfully

    expose:
      - "80"

    networks:
      - meterlab-network


  # ============================================================
  # MYSQL 8.4
  # ============================================================
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Africa/Nairobi

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - meterlab-network

  # ============================================================
  # QUEUE WORKER
  # ============================================================
  worker:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - path: .env
        required: false

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      LOG_CHANNEL: stderr

    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=300

    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy

    networks:
      - meterlab-network

  # ============================================================
  # LARAVEL SCHEDULER
  # ============================================================
  scheduler:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - path: .env
        required: false

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      LOG_CHANNEL: stderr

    command:
      - php
      - artisan
      - schedule:work

    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy

    networks:
      - meterlab-network

# ============================================================
# NETWORKS
# ============================================================
networks:
  meterlab-network:
    driver: bridge

# ============================================================
# PERSISTENT VOLUMES
# ============================================================
volumes:
  mysql_data:
  laravel_storage:
  public_assets:
