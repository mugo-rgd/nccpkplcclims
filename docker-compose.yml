
name: meterlab

services:

  # ============================================================
  # LARAVEL PHP-FPM APPLICATION
  # ============================================================
  app:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    working_dir: /var/www/html

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      LOG_CHANNEL: stderr

    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "9000"

    networks:
      - meterlab-network

  # ============================================================
  # NGINX WEB SERVER
  # ============================================================
  nginx:
    image: nginx:alpine

    restart: unless-stopped

    volumes:
      - public_assets:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    expose:
      - "80"

    networks:
      - meterlab-network

  # ============================================================
  # MYSQL DATABASE
  # ============================================================
  db:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Africa/Nairobi

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - meterlab-network

  # ============================================================
  # LARAVEL QUEUE WORKER
  # ============================================================
  worker:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}

    restart: unless-stopped
    working_dir: /var/www/html

    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=300

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      LOG_CHANNEL: stderr

    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

    networks:
      - meterlab-network

  # ============================================================
  # LARAVEL SCHEDULER
  # ============================================================
  scheduler:
    image: meterlab-php:${APP_IMAGE_TAG:-latest}

    restart: unless-stopped
    working_dir: /var/www/html

    command:
      - php
      - artisan
      - schedule:work

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      LOG_CHANNEL: stderr

    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

    networks:
      - meterlab-network

# ================================================================
# NETWORKS
# ================================================================
networks:
  meterlab-network:
    driver: bridge

# ================================================================
# PERSISTENT VOLUMES
# ================================================================
volumes:
  mysql_data:
  laravel_storage:
  public_assets:
